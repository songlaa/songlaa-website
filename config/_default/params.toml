# Intro section - Our training programs (module descriptions)
[intro]

[[intro.item]]
title = "Kubernetes Fundamentals"
description = "Learn Kubernetes from the ground up — with security woven in from the very first pod to a production-ready cluster, through engaging, hands-on exercises."
icon = "hub"

[[intro.item]]
title = "Kubernetes Security"
description = "Master Kubernetes with a hands-on focus on security — from network policies to runtime protection, with a strong emphasis on practical labs."
icon = "shield"

[[intro.item]]
title = "Custom Security Training"
description = "Get a fully tailored security training program for Cloud Native Technologies, designed around your needs — complete with immersive hands-on labs."
icon = "bolt"

