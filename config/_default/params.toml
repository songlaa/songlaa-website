# Training sections for the homepage
[kubernetes_fundamentals]
enable = true
subtitle = "Introduction to Kubernetes, the secure way"
description = "Learn the core components and architecture of Kubernetes with security-focused hands-on labs."
duration = "2 Days Workshop"
audience1 = "Beginners or professionals who want to understand Kubernetes fundamentals."
audience2 = "Developers wanting to understand the infrastructure their applications run on."
outcomes = "Participants will be able to securely build, deploy and manage applications in Kubernetes clusters with confidence."

[kubernetes_security]
enable = true
description = "Comprehensive security hardening from the container to the cluster level. Focus on Hands-On Lab with CTFs included."
duration = "2-3 Days Workshop"
audience1 = "Professionals responsible for auditing and securing cloud-native stacks."
audience2 = "CISO, DevOps & Platform Engineers hardening production environments."
outcomes = "Participants will securely build, deploy and manage applications in Kubernetes and understand and implement Kubernetes security best practices, policies, and controls."

[custom_training]
description = "Get a fully tailored security training program for Cloud Native Technologies, designed around your needs — complete with immersive hands-on labs."
audience1 = "Custom trainings are for everyone interested in Cloud Security: from Dev to Management"
audience2 = "Can be tailored as a workshop or as a Deep Dive."
platform_specifics_desc = "Custom trainins can focus on your specific platforms (AKS, On-Prem) etc."
advanced_tooling_desc = "Deep dives into specific tools like Cilium, Istio Service Mesh security, or HashiCorp Terraform IaC."

[training_philosophy]
description = "Our trainings are built around one principle: we only teach what we run ourselves in production. That means every concept is battle-tested, every lab is realistic, and every insight is drawn from real-world Kubernetes operations at scale."

[trainer]
bio = "With over a decade of hands-on Kubernetes engineering, Gabriel Graf has built, hardened, and operated production-critical clusters at scale. CISSP and CKA certified, he brings deep security expertise combined with real-world operational experience – a combination that has made his trainings highly effective for banks, insurances, pharma, tech, and financial services companies. Based in Bern, Gabriel is usually dreaming of the sea and surfing when he's not securing or building clusters or cloud solutions."



