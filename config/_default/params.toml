#################### default parameters ################################
# favicon
favicon = "images/favicon.png"
# logo
logo = "images/logo.png"
# use `px` or `x` with logo_width, example: "100px".
# Note: logo_width is not work with .svg file
logo_width = "150px"
# logo text will only show when logo is missing.
logo_text = "Songlaa"
# navbar fixed to top
navbar_fixed = false
# OpenGraph / Twitter Card metadata
description = "Kubernetes & Cloud Native Security On-Site Training – delivered by engineers, hands-on and fully customizable"
author = "Songlaa"
image = "images/logo.png" # this image will be used as fallback if a page has no image of its own

# Social media and SEO
keywords = "kubernetes training, kubernetes security, cloud native security, docker training, container security, DevSecOps, cybersecurity training"
# Whether to display text descriptors (like "E-mail: ", "Phone: ") before the address block elements
address_descriptors = false

# Navigation
[navigation]
brand = "Songlaa"
home = "Home"
work = "Trainings"
testimonials = "Testimonials"
services = "Services"
about = "About"
contact = "Contact"

# Hero section
[hero]
title = "Kubernetes & Cloud Native Security On-Site Training"
subtitle = "delivered by engineers, hands-on and fully customizable"

# Intro section - Our training programs
[intro]

[[intro.item]]
title = "Delivered by Engineers"
description = "Our instructors aren't just trainers; they are practicing security engineers who build and secure large-scale Kubernetes clusters daily."
icon = "engineering"

[[intro.item]]
title = "100% Hands-On"
description = "Skip the endless slides. Our training is built around real-world scenarios, live-hacking sessions, and intensive laboratory exercises."
icon = "front_hand"

[[intro.item]]
title = "Fully Customizable"
description = "Every team is different. We tailor our curriculum to match your specific tech stack, cloud provider, and internal security policies."
icon = "tune"

# contact info
