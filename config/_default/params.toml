# Training sections for the homepage
[kubernetes_fundamentals]
enable = true
subtitle = "Security from the start"
description = "Focusing on the operational foundation, declarative state management all in a secure manner."
duration = "2 Days Workshop"
audience1 = "Engineers new to Kubernetes who need a solid foundation for production operations."
audience2 = "Developers wanting to understand the infrastructure their applications run on."
outcomes = "Participants will be able to deploy and manage applications in Kubernetes clusters with confidence."

[kubernetes_security]
enable = true
description = "Comprehensive security hardening from the container to the cluster level."
duration = "2-3 Days Workshop"
audience1 = "Security professionals responsible for auditing and securing cloud-native stacks."
audience2 = "DevOps & Platform Engineers hardening production environments."
outcomes = "Participants will understand and implement Kubernetes security best practices, policies, and controls."

[cilium]
description = "Bespoke curriculum designed around your unique infrastructure and challenges."
audience1 = "Advanced teams with specific compliance (SOC2/PCI) or platform requirements."
audience2 = "Enterprise architecture teams designing global-scale secure platforms."
platform_specifics_desc = "Specialized sessions for EKS (AWS), GKE (Google), or AKS (Azure) security best practices and IAM integration."
advanced_tooling_desc = "Deep dives into specific tools like Cilium, Istio Service Mesh security, or HashiCorp Vault integration."

[secure_stack]
description = "Modern security is multi-layered. We cover the entire lifecycle, from building secure images to monitoring runtime behavior in high-traffic production clusters."

[trainer]
bio = "With over a decade of hands-on Kubernetes engineering, Gabriel Graf has built, hardened, and operated production-critical clusters at scale. CISSP and CKA certified, he brings deep security expertise combined with real-world operational experience – a combination that has made his trainings highly effective for banks, insurances, pharma, tech, and financial services companies. Based in Bern, Gabriel is usually dreaming of the sea and surfing when he's not securing or building clusters or cloud solutions."



