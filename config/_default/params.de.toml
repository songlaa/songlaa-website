home = "Home"
contact = "Kontakt"

# Hero section (German)
[hero]
title = "Kubernetes & Cloud Native Security On-Site Schulungen"
subtitle = "von Engineers, praxisnah und auf Ihr Team zugeschnitten"

# Intro section (German - module descriptions)
[intro]
description = "Kubernetes ist der Standard für Container, der Einstieg aber oft anspruchsvoll - vor allem, wenn Sicherheit von Anfang an mitgedacht wird. Genau hier setzen wir an: Wir planen, bauen und schützen solche Plattformen selbst im Alltag. In unseren Trainings Kubernetes Fundamentals, Kubernetes Security und Custom Security Training verbinden wir klare Grundlagen mit realen Szenarien, bewährten Methoden und vielen praktischen Labs."

[[intro.item]]
title = "Kubernetes Fundamentals"
description = "Sie lernen die Container-Technologie und Kubernetes-Konzepte und schaffen ein sicheres Fundament - vom ersten Pod bis zum produktionsreifen Cluster."
icon = "hub"
link = "#module-fundamentals"

[[intro.item]]
title = "Kubernetes Security & Hacking"
description = "Sie vertiefen Kubernetes-Sicherheit in der Praxis: von Netzwerksegmentierung und Richtlinien bis zu wirksamem Laufzeitschutz."
icon = "shield"
link = "#module-security"

[[intro.item]]
title = "Custom Security Training"
description = "Gemeinsam entwickeln wir ein vollständig massgeschneidertes Security-Training für Ihre Cloud-Native-Umgebung - inklusive passender Labs."
icon = "bolt"
link = "#module-custom"

