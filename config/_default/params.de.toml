# Training sections - match English page exactly
[kubernetes_fundamentals]
enable = true
subtitle = "Sicherheit von Anfang an"
description = "Umfassende Einführung in Container und Kubernetes - ein stabiles Fundament, um Kubernetes und Container sicher und effizient zu betreiben."
duration = "2 Tage Workshop"
audience1 = "Engineers, die in Kubernetes einsteigen und ein solides Fundament für den Produktionsbetrieb aufbauen wollen."
audience2 = "Entwicklerinnen und Entwickler, die verstehen möchten, wie ihre Anwendungen auf der Plattform laufen."
outcomes = "Die Teilnehmenden können Anwendungen in Kubernetes-Clustern sicher bereitstellen, betreiben und zielgerichtet weiterentwickeln."

[kubernetes_security]
enable = true
description = "Umfassende Sicherheit vom Container bis zum Cluster. Sie lernen typische Schwachstellen in Kubernetes kennen, erleben mit CTFs konkrete Angriffsszenarien und leiten daraus wirksame Schutzmassnahmen ab - praxisnah und direkt umsetzbar."
duration = "2-3 Tage Workshop"
audience1 = "Security-Expertinnen und -Experten, die Cloud-Native-Stacks prüfen, absichern und weiterentwickeln."
audience2 = "DevOps- und Platform-Engineers, die Produktionsumgebungen systematisch härten."
outcomes = "Die Teilnehmenden können Sicherheits-Controls, Richtlinien und Best Practices in Kubernetes wirksam umsetzen."

[custom_training]
description = "Individuelle Cloud-Native-Security-Trainings, exakt auf Ihre Anforderungen zugeschnitten - mit Theorie und praxisnahen Hands-on-Labs."
audience1 = "Individuelle Trainings können an die jeweilige Situation angepasst werden."
audience2 = "Die Trainings lassen sich als Workshop oder als Deep Dive gestalten."
platform_specifics_desc = "Der Fokus der Schulung ist abhängig von Ihnen und Ihrer Infrastruktur."
advanced_tooling_desc = "Deep Dives in spezifische Tools wie Cilium, Istio Service Mesh Security oder HashiCorp IaC."

[training_philosophy]
description = "Unsere Trainings basieren auf einem Grundsatz: Wir lehren nur, was wir selbst in Produktion betreiben. Jedes Konzept ist praxiserprobt, jedes Lab ist realistisch, und jede Erkenntnis stammt aus echtem Kubernetes-Betrieb im grossen Massstab."

[trainer]
bio = "Gabriel Graf baut, sichert und betreibt seit 10 Jahren produktive Cluster in unterschiedlichen Grössenordnungen. Als CISSP- und CKA-zertifizierter Engineer verbindet er Sicherheitswissen mit Hands-on-Praxis - eine Kombination, die seine Trainings unter anderem für Banken, Versicherungen, Pharma-, Tech- und Finanzunternehmen besonders wertvoll macht. Gabriel lebt mit seiner Familie in Bern und träumt, wenn er nicht gerade Cluster oder Cloud-Lösungen absichert oder aufbaut, vom Meer und fernen Ländern."

