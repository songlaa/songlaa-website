<!DOCTYPE html>
<html class="scroll-smooth" lang="{{ .Site.LanguageCode }}">
    <head>
        {{ partial "head.html" .}}
    </head>
    <body class="bg-surface text-on-surface font-body selection:bg-primary-container selection:text-on-primary-container">
        {{ partial "nav.html" .}}

        <main class="pt-20">
            <section class="py-32 bg-surface-container-low">
                <div class="max-w-4xl mx-auto px-6">
                    <h1 class="text-4xl md:text-5xl font-extrabold font-headline tracking-tighter text-on-surface mb-6">{{ .Title }}</h1>
                    {{ with .Description }}
                    <p class="text-xl text-on-surface-variant mb-12">{{ . }}</p>
                    {{ end }}
                    <div class="prose prose-lg max-w-none text-on-surface-variant">
                        {{ .Content }}
                    </div>
                    <div class="mt-12 flex gap-4">
                        <a href="{{ .Site.BaseURL }}" class="px-8 py-3 bg-gradient-to-r from-primary to-primary-container text-on-primary rounded-full font-bold hover:scale-105 transition-transform no-underline inline-flex items-center gap-2">
                            <span class="material-symbols-outlined">arrow_back</span>
                            {{ i18n "back_to_home" }}
                        </a>
                    </div>
                </div>
            </section>
        </main>

        {{ partial "js.html" .}}
    </body>
</html>
