<section class="relative min-h-[819px] flex items-center overflow-hidden pt-20">
    <div class="absolute inset-0 z-0">
        <img class="w-full h-full object-cover opacity-30" alt="Kubernetes and Cloud Native Security Training" src="{{ "images/slider-bg-songlaa.jpg" | absURL }}" loading="eager" decoding="async" fetchpriority="high">
        <div class="absolute inset-0 bg-gradient-to-br from-[#0a1628]/90 via-[#0061a6]/70 to-[#006c52]/60"></div>
    </div>
    <div class="max-w-7xl mx-auto px-6 relative z-10 py-20">
        <div class="max-w-4xl">
            <span class="inline-block px-4 py-1 rounded-full bg-white/15 text-white/90 backdrop-blur-sm border border-white/20 text-xs font-bold tracking-widest uppercase mb-6">Songlaa</span>
            <h1 class="text-5xl md:text-7xl font-extrabold font-headline tracking-tighter text-white leading-[1.1] mb-8">
                {{ with .Site.Params.hero.title }}{{ . | markdownify }}{{ end }}
            </h1>
            <p class="text-xl md:text-2xl text-white/80 font-body leading-relaxed mb-12 max-w-2xl">
                {{ with .Site.Params.hero.subtitle }}{{ . | markdownify }}{{ end }}
            </p>
        </div>
    </div>
</section>
