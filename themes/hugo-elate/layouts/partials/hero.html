<section class="relative min-h-[819px] flex items-center overflow-hidden pt-20">
    <div class="absolute inset-0 z-0">
        <img class="w-full h-full object-cover opacity-20 filter grayscale" alt="Kubernetes and Cloud Native Security Training" src="{{ "images/slider-bg-songlaa.jpg" | absURL }}">
        <div class="absolute inset-0 bg-gradient-to-tr from-surface via-surface/90 to-transparent"></div>
    </div>
    <div class="max-w-7xl mx-auto px-6 relative z-10 py-20">
        <div class="max-w-4xl">
            <span class="inline-block px-4 py-1 rounded-full bg-secondary-container text-on-secondary-container text-xs font-bold tracking-widest uppercase mb-6">Songlaa Security</span>
            <h1 class="text-5xl md:text-7xl font-extrabold font-headline tracking-tighter text-on-surface leading-[1.1] mb-8">
                {{ with .Site.Params.hero.title }}{{ . | markdownify }}{{ end }}
            </h1>
            <p class="text-xl md:text-2xl text-on-surface-variant font-body leading-relaxed mb-12 max-w-2xl">
                {{ with .Site.Params.hero.subtitle }}{{ . | markdownify }}{{ end }}
            </p>
            <div class="flex flex-wrap gap-4">
                <a class="px-10 py-4 bg-gradient-to-r from-primary to-primary-container text-on-primary rounded-full font-bold text-lg hover:scale-105 transition-transform inline-flex items-center gap-2 no-underline" href="#modules">
                    {{ if eq .Site.Language.Lang "de" }}Module ansehen{{ else }}View Modules{{ end }}
                    <span class="material-symbols-outlined">arrow_downward</span>
                </a>
            </div>
        </div>
    </div>
</section>
